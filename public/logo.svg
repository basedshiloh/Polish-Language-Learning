<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PolishPal logo">
  <defs>
    <linearGradient id="ppBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4750F8"/>
      <stop offset="1" stop-color="#161CA3"/>
    </linearGradient>
  </defs>

  <!-- Rounded app tile in calm blue-indigo -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#ppBlue)"/>

  <!-- Speech-bubble tail (open communication) -->
  <path d="M180 300 L150 384 L246 312 Z" fill="#ffffff"/>

  <!-- Speech bubble — everyone has a voice -->
  <rect x="116" y="96" width="280" height="224" rx="56" fill="#ffffff"/>

  <!-- Polish letter Ł -->
  <rect x="196" y="146" width="40" height="138" rx="6" fill="#242EF7"/>
  <rect x="196" y="244" width="110" height="40" rx="6" fill="#242EF7"/>
  <line x1="178" y1="240" x2="252" y2="192" stroke="#242EF7" stroke-width="22" stroke-linecap="round"/>

  <!-- Heart accent (inclusivity / community) -->
  <path transform="translate(300,140) scale(1.7)" fill="#242EF7"
        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
</svg>
